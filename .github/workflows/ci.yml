name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Check (types, lint, build, tests)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: comment_lens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d comment_lens_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/comment_lens_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build
      - name: Apply database migrations
        run: pnpm run db:migrate
      - name: Run unit tests and coverage
        run: pnpm run test:coverage
      - name: Run integration tests
        run: pnpm run test:integration
      - name: Run performance tests
        run: pnpm run test:performance
      - name: Upload performance artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: comment-lens-performance-${{ github.run_id }}
          path: tests/performance/artifacts/large-comments.json
          if-no-files-found: ignore
          retention-days: 7

  python:
    name: Python (scanner, worker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install scanner and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e scanner pytest
      - name: Run scanner tests
        run: python -m pytest scanner/tests
      - name: Run worker tests
        run: python -m unittest discover worker -p 'test_*.py'

  e2e:
    name: UI E2E (Playwright)
    needs: [secrets, check, python]
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run UI E2E
        run: pnpm run test:e2e
      - name: Upload Playwright artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: comment-lens-playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Trigger Vercel Deployment
    needs: [secrets, check, python, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Production Deploy Hook
        run: |
          curl -sS -f -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_PROD }}"
