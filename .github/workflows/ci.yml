name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Check (types, lint, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Run unit tests and coverage
        run: pnpm run test:coverage

  e2e:
    name: UI E2E (Playwright)
    needs: [secrets, check]
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/comment_lens_test
      GITHUB_CLIENT_ID: test-client
      GITHUB_CLIENT_SECRET: test-secret
      SESSION_SECRET: test-session-secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run UI E2E
        run: pnpm run test:e2e
      - name: Upload Playwright artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: comment-lens-playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Trigger Vercel Deployment
    needs: [secrets, check, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Staging Deploy Hook
        if: github.ref == 'refs/heads/staging'
        run: |
          curl -sS -f -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_STAGING }}"

      - name: Trigger Production Deploy Hook
        if: github.ref == 'refs/heads/main'
        run: |
          curl -sS -f -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_PROD }}"
