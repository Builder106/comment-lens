[project]
name = "comment-lens-scanner"
version = "0.1.0"
description = "Non-executing source comment inventory scanner for Comment Lens"
requires-python = ">=3.12"
dependencies = [
  "pygments>=2.17,<3",
  "tree-sitter>=0.22,<0.26",
  "tree-sitter-languages>=1.10,<2",
]

[project.scripts]
comment-lens-scan = "comment_lens_scanner.core:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
