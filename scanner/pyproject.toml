[project]
name = "comment-lens-scanner"
version = "0.1.0"
description = "Non-executing source comment inventory scanner for Comment Lens"
requires-python = ">=3.12"
dependencies = [
  "pygments>=2.17,<3",
  "tree-sitter-language-pack>=1,<2",
]

[project.scripts]
comment-lens = "comment_lens_scanner.cli:main"
comment-lens-scan = "comment_lens_scanner.core:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["comment_lens_scanner"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "except ImportError:",
  "if __name__ == .__main__.:",
]
