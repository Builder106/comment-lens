[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comment-lens-scanner"
version = "0.1.0"
description = "Deterministic source comment maintenance and quality scanner"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Olayinka Vaughan" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pygments>=2.17,<3",
  "tree-sitter-language-pack>=1,<2",
]

[project.urls]
Homepage = "https://github.com/Builder106/comment-lens"
Repository = "https://github.com/Builder106/comment-lens"
Issues = "https://github.com/Builder106/comment-lens/issues"

[project.scripts]
comment-lens = "comment_lens_scanner.cli:main"
comment-lens-scan = "comment_lens_scanner.core:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["comment_lens_scanner"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "except ImportError:",
  "if __name__ == .__main__.:",
]
